search:
  queries:
    - query: "restaurants"
      location: "Dallas, TX"
    - query: "plumbers"
      location: "Austin, TX"
  max_results_per_query: 10
  delay_between_requests: 3
  # 0=disabled, 0.85=recommended. Uses difflib.SequenceMatcher on business names
  fuzzy_dedup_threshold: 0.85

api:
  provider: "serpapi"

qualification:
  non_website_domains:
    - facebook.com
    - instagram.com
    - yelp.com
    - yellowpages.com
    - tripadvisor.com
    - linktr.ee
    - linktree.com
    - twitter.com
    - x.com
    - tiktok.com
    - nextdoor.com
    - bbb.org
    - mapquest.com
    - foursquare.com
  website_check_timeout: 5

llm:
  provider: "gemini"
  model: "gemini-2.0-flash-lite"
  temperature: 0.1
  max_retries: 3

cache:
  enabled: true
  ttl_hours: 24
  cache_dir: "data/cache"

enrichment:
  enabled: false
  # Options: hunter (requires HUNTER_API_KEY), whois (free, needs `whois` CLI), llm (uses your LLM key)
  provider: "whois"

export:
  formats:
    - "json"
    - "csv"
  output_dir: "data/exports"
