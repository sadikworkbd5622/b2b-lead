search:
  # Target small/local service businesses likely to use Facebook/Instagram instead of a website
  queries:
    # Food trucks (almost always social media only)
    - query: "food truck"
      location: "Dallas, TX"
    - query: "food truck"
      location: "Austin, TX"
    # Dog walkers / pet sitters
    - query: "dog walker"
      location: "Round Rock, TX"
    - query: "pet sitter"
      location: "Plano, TX"
    # House cleaners
    - query: "house cleaning service"
      location: "Frisco, TX"
    - query: "house cleaning"
      location: "Garland, TX"
    # Handymen / odd jobs
    - query: "handyman"
      location: "Carrollton, TX"
    - query: "handyman"
      location: "McKinney, TX"
    # Lawn care / landscaping
    - query: "lawn care"
      location: "Denton, TX"
    - query: "lawn mowing service"
      location: "Irving, TX"
    # Mobile hair / barber
    - query: "mobile hair stylist"
      location: "Dallas, TX"
    - query: "barber"
      location: "Garland, TX"
    # Caterers
    - query: "caterer"
      location: "Austin, TX"
    - query: "private chef"
      location: "Plano, TX"
    # Personal trainers
    - query: "personal trainer"
      location: "Frisco, TX"
    - query: "yoga instructor"
      location: "Round Rock, TX"
    # Towing & auto
    - query: "towing service"
      location: "Irving, TX"
    - query: "mobile mechanic"
      location: "Denton, TX"
    # Car detailers
    - query: "mobile car detailing"
      location: "McKinney, TX"
    - query: "auto detailer"
      location: "Carrollton, TX"
    # Tutors
    - query: "tutor"
      location: "Plano, TX"
    - query: "music teacher"
      location: "Frisco, TX"
    # Junk removal
    - query: "junk removal"
      location: "Dallas, TX"
    - query: "dumpster rental"
      location: "Austin, TX"
  max_results_per_query: 20
  delay_between_requests: 2
  # 0=disabled, 0.85=recommended. Uses difflib.SequenceMatcher on business names
  fuzzy_dedup_threshold: 0.85

api:
  provider: "serpapi"

qualification:
  non_website_domains:
    - facebook.com
    - instagram.com
    - yelp.com
    - yellowpages.com
    - tripadvisor.com
    - linktr.ee
    - linktree.com
    - twitter.com
    - x.com
    - tiktok.com
    - nextdoor.com
    - bbb.org
    - mapquest.com
    - foursquare.com
  website_check_timeout: 5

llm:
  # Options: openai, gemini, groq
  provider: "groq"
  model: "llama-3.1-8b-instant"
  temperature: 0.1
  max_retries: 3

cache:
  enabled: true
  ttl_hours: 24
  cache_dir: "data/cache"

enrichment:
  enabled: false
  # Options: hunter (requires HUNTER_API_KEY), whois (free, needs `whois` CLI), llm (uses your LLM key)
  provider: "whois"

export:
  formats:
    - "json"
    - "csv"
  output_dir: "data/exports"
