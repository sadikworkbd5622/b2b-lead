name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ tests/ --ignore=E501

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Test with pytest
        run: pytest tests/ -v --cov=app --cov-fail-under=45

      - name: Import consistency check
        run: python -c "from app import *; print('All imports OK')"
